[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flexflag"
version = "0.1.0.dev0"
description = "Cheap triage flag for proteins that change shape between apo and holo states."
readme = "README.md"
license = "MIT"
authors = [{ name = "Aryan Sinha" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "requests>=2.31",
    "gemmi>=0.6",
    "scikit-learn>=1.4",
    "typer>=0.12",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
flexflag = "flexflag.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
